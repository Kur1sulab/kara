name: Windows 绿色版

# 只在真 Windows 上构建和验证。
# 为什么不用 ubuntu 交叉组装：结构能拼出来，但 ._pth 路径解析、GBK 控制台、
# sqlite3.dll 能否加载、bat 能否被 cmd 执行——这四件事只有 Windows 说了算。
# 引擎（Go）先在 ubuntu 上交叉编译成 sweep.exe，再进 Windows 作业组装。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    name: 交叉编译引擎（sweep.exe）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
      - name: 编译 Windows 引擎
        working-directory: engine-go
        run: |
          mkdir -p ../build
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/Kur1sulab/kara/engine-go/cli.Version=v1.1.0" \
            -o ../build/sweep-win64.exe ./cmd/sweep
          ls -l ../build/sweep-win64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sweep-win64
          path: build/sweep-win64.exe
          if-no-files-found: error

  bundle:
    name: 组装 + 真机冒烟（windows-latest）
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: sweep-win64
          path: build

      - name: 取官方 embeddable 运行时
        shell: pwsh
        run: |
          $ver = "3.12.8"
          $url = "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile py-embed.zip -UseBasicParsing
          $len = (Get-Item py-embed.zip).Length
          Write-Host "大小: $len 字节"
          if ($len -lt 8000000) { throw "运行时包太小，下载不完整" }

      - name: 组装绿色版
        run: python tools/build_win_bundle.py --python-zip py-embed.zip --out dist

      - name: 解压交付物
        shell: pwsh
        run: |
          # 用 Expand-Archive 而不是 tar：前者走 .NET ZipFile，认 zip 的 UTF-8 文件名
          # 标志位，和用户双击解压是同一套逻辑。Windows 自带的 bsdtar 即使包里标了
          # UTF-8，遇到非 ASCII 名称仍会报 "empty or unreadable filename" 并以 1 退出
          # ——所以打包侧的文件名也一并改成纯 ASCII，两头都不赌。
          $zip = Get-ChildItem dist\kara-*-win64.zip | Select-Object -First 1
          if (-not $zip) { throw "没有产出 zip" }
          Write-Host "交付物: $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath smoke -Force
          Write-Host "--- 解压结果（包内带顶层目录 kara-<版本>-win64）---"
          Get-ChildItem smoke | Select-Object Name, Length | Format-Table -AutoSize

      - name: 解释器与模块自检
        shell: pwsh
        run: |
          Set-Location (Get-ChildItem smoke -Directory | Select-Object -First 1).FullName
          Write-Host "--- 当前目录 $(Get-Location) ---"
          Write-Host "--- 包内解释器 ---"
          .\python\python.exe -c "import sys; print(sys.version); print(sys.executable)"
          Write-Host "--- 模块导入（验证 ._pth 的 .. 生效）---"
          .\python\python.exe -c "import vc.cli, vc.cli_extra, vc.paths, vc.store, vc.parsers, vc.scans, vc.ingest; print('IMPORT-OK')"

      - name: 端到端冒烟（包内解释器真跑 CLI）
        shell: pwsh
        run: |
          Set-Location (Get-ChildItem smoke -Directory | Select-Object -First 1).FullName
          .\python\python.exe tests\smoke_bundle.py

      - name: 真跑 kara.bat
        shell: pwsh
        run: |
          Set-Location (Get-ChildItem smoke -Directory | Select-Object -First 1).FullName
          $out = cmd.exe /c "kara.bat" 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "kara.bat 退出码 $LASTEXITCODE" }
          if ($out -notmatch "空境") { throw "kara.bat 没打出状态页 —— 交付物不可用" }
          Write-Host "OK kara.bat 在真 Windows 上可用"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kara-win64
          path: dist/*.zip
          if-no-files-found: error

      - name: 附到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
